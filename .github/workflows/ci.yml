---
name: CI

"on":
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  # Weekly, to catch changes in the AnyDesk repository or key.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ansible-core ansible-lint yamllint
      - run: yamllint .
      - run: ansible-lint

  molecule:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu2204, ubuntu2604]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ansible-core molecule "molecule-plugins[docker]" docker
      - run: molecule test
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

  # Needs the GALAXY_API_KEY secret (galaxy.ansible.com, Collections, API token).
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, molecule]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ansible-core
      - run: >-
          ansible-galaxy role import --token "$GALAXY_API_KEY"
          "${GITHUB_REPOSITORY_OWNER}" "${GITHUB_REPOSITORY#*/}"
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
