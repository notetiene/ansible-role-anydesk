---
# Included once per entry of anydesk_system_options_per_user (item), since a
# block cannot loop.

- name: Configure the AnyDesk system.conf file of {{ item.user }}
  become: true
  block:
    - name: Get the passwd entry of {{ item.user }}
      ansible.builtin.getent:
        database: passwd
        key: "{{ item.user }}"
        split: ":"

    - name: Set the AnyDesk configuration file of {{ item.user }}
      ansible.builtin.set_fact:
        anydesk__current_config: >-
          {{ item.config_file
             | default(ansible_facts['getent_passwd'][item.user][4] ~ '/.anydesk/system.conf') }}

    - name: Create the AnyDesk configuration directory of {{ item.user }}
      ansible.builtin.file:
        path: "{{ anydesk__current_config | dirname }}"
        owner: "{{ item.user }}"
        group: "{{ item.user }}"
        mode: "0755"
        state: directory

    - name: Set the AnyDesk options of {{ item.user }}
      ansible.builtin.lineinfile:
        path: "{{ anydesk__current_config }}"
        regexp: "^{{ options.name | regex_escape }}="
        line: "{{ options.name }}={{ options.value }}"
        create: true
        owner: "{{ item.user }}"
        group: "{{ item.user }}"
        mode: "0644"
      loop: "{{ item.options }}"
      loop_control:
        loop_var: options
      ignore_errors: "{{ ansible_check_mode }}"
